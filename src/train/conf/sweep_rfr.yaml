program: train.py
method: bayes
metric:
  name: val_rmse
parameters:
  model.criterion:
    value: squared_error
  model.n_estimators:
    min: 100
    max: 200
  model.max_depth: 
    values: [4, 6, 8, 10, 999]
  model.max_features:
    values: ["sqrt", "log2", 1.0, 0.3]
  model.min_samples_split:
    min: 2
    max: 5
  model.min_samples_leaf:
    min: 1
    max: 2
  model.max_samples:
    min: 0.5
    max: 1.0
command:
- uv
- run
- -m
- src.train.train
- +model=rfr
- ${args_no_hyphens}